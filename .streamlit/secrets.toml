# .streamlit/secrets.toml
# NO SUBAS ESTE ARCHIVO A GITHUB CON CREDENCIALES REALES
# Usa los secrets de Streamlit Cloud en su lugar

[google]
type = "service_account"
project_id = "tu-proyecto-id"
private_key_id = "tu-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nTU_CLAVE_PRIVADA_AQUI\n-----END PRIVATE KEY-----\n"
client_email = "tu-servicio@tu-proyecto.iam.gserviceaccount.com"
client_id = "tu-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/tu-servicio%40tu-proyecto.iam.gserviceaccount.com"

[sendgrid]
api_key = "SG.tu_api_key_aqui"

[secrets]
jwt_secret_key = "tu_clave_secreta_muy_segura"
email_from = "tu-email@verificado.com"
app_name = "Almacen Consorcio"
